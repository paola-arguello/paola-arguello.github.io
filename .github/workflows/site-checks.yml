name: Site checks

# Runs on every pull request into main. It only reads the repository:
# it cannot push, merge, render or deploy anything.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atlas table and links
        run: python scripts/check_site.py
