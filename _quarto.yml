project:
  type: website
  output-dir: docs

website:
  title: "Lunaland"
  site-url: "https://paola-arguello.github.io"
  favicon: assets/lunaland_logo.png
  description: "Scientific data interpretation: how messy biological data moves through analysis, uncertainty, and communication."

  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Projects"
        href: projects/index.qmd
      - text: "Pitfalls Lab"
        href: pitfalls/index.qmd
      - text: "The Crosswalk"
        href: crosswalk/index.qmd
      - text: "Concept Atlas"
        href: atlas/index.qmd
      - text: "About"
        href: about.qmd

    right:
      - icon: github
        href: https://github.com/paola-arguello

  page-footer:
    center: 
      <div class="footer-brand">

        <div class="footer-logo-row">
          <img src="/assets/lunaland_logo.png" alt="Lunaland logo" class="footer-logo">
        </div>

        <div class="footer-text">
          Lunaland  ●   Scientific data interpretation and communication
        </div>

      </div>

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    page-layout: full